<!DOCTYPE html>
<html> 
    <head>
        <title>Lists in HTML</title> 
    </head>
    <body>
        <h1> Ordered list</h1>
        <ol>
            <li>Apples</li>
            <li>Mangoes</li>
            <li>Oranges</li>
        </ol>
        <h2>Unordered Lists</h2>
        <ul>
            <li>Red</li>
            <li>Red panda</li>
            <li>Purple</li>
        </ul>
        <h3>Definition list</h3>
        <d1>
            <dt>Home</dt>
            <dt>About</dt>
            <dt>Contact Us</dt>
        </d1>
    </body>
</html>
